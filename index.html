<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Core 處理核心 | 科技感介面</title>
    <!-- 引入所有依賴套件 -->
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <style>
        /* 基礎暗色宇宙背景 */
        body { 
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; 
            max-width: 700px; margin: 40px auto; padding: 20px; 
            background: linear-gradient(135deg, #0b0f19 0%, #1a1a2e 100%);
            color: #E0E7FF; 
            min-height: 100vh;
        }
        
        h2 { text-align: center; color: #FFFFFF; letter-spacing: 2px; text-shadow: 0 0 10px rgba(0, 240, 255, 0.4); }
        h2 span { color: #00F0FF; }

        /* 科技感毛玻璃上傳區塊 */
        .upload-section { 
            margin-bottom: 20px; 
            background: rgba(15, 23, 42, 0.4);
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 240, 255, 0.2); 
            border-radius: 16px; 
            text-align: center; 
            transition: all 0.3s ease;
            position: relative;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5), inset 0 0 20px rgba(0, 240, 255, 0.05);
        }
        /* 拖曳高亮特效 (霓虹發光) */
        .upload-section.dragover {
            background: rgba(15, 23, 42, 0.8);
            border-color: #00F0FF;
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.3), inset 0 0 15px rgba(0, 240, 255, 0.2);
        }
        .upload-label { display: block; cursor: pointer; padding: 40px 20px; }
        .upload-icon { font-size: 54px; color: #00F0FF; margin-bottom: 15px; text-shadow: 0 0 15px rgba(0, 240, 255, 0.6); transition: transform 0.2s; }
        .upload-section.dragover .upload-icon { transform: scale(1.1); }
        .upload-title { font-size: 18px; font-weight: 600; margin-bottom: 5px; color: #FFFFFF; }
        .upload-subtitle { font-size: 14px; color: #94A3B8; }
        #pdfInput { display: none; }
        
        /* 列表容器 */
        .file-list-container { margin-top: 10px; text-align: left; padding: 0 20px;}
        .list-header { color: #00F0FF; font-size: 14px; margin-bottom: 10px; letter-spacing: 1px; }
        #fileList { list-style: none; padding: 0; margin: 0; }
        
        /* 單一檔案項目 (暗色半透明) */
        .sortable-item { 
            display: flex; align-items: center; padding: 10px 12px; margin-bottom: 8px; 
            background: rgba(255, 255, 255, 0.03); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            border-radius: 8px; 
            transition: all 0.2s;
        }
        .sortable-item:hover { background: rgba(255, 255, 255, 0.08); border-color: rgba(0, 240, 255, 0.4); }
        .drag-handle { cursor: grab; margin-right: 12px; color: #00F0FF; font-size: 20px; padding: 0 5px; user-select: none; }
        .drag-handle:active { cursor: grabbing; color: #FFFFFF; }
        
        .thumbnail-container { width: 40px; height: 56px; margin-right: 15px; display: flex; justify-content: center; align-items: center; background-color: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1); border-radius: 4px; overflow: hidden; }
        .pdf-thumbnail { max-width: 100%; max-height: 100%; object-fit: contain; }
        .loading-text { font-size: 10px; color: #00F0FF; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }
        
        .file-name { flex-grow: 1; font-size: 14px; word-break: break-all; color: #E2E8F0; }
        .remove-btn { background: none; border: none; color: #FF3366; cursor: pointer; font-size: 16px; padding: 5px; margin-left: 10px; transition: text-shadow 0.2s; }
        .remove-btn:hover { text-shadow: 0 0 10px rgba(255, 51, 102, 0.6); }
        .sortable-ghost { opacity: 0.3; background: rgba(0, 240, 255, 0.1); border: 1px dashed #00F0FF; }
        
        /* 控制面板區塊 */
        .settings-panel { 
            margin: 25px 20px 15px 20px; padding: 15px; 
            background: rgba(0, 0, 0, 0.2); 
            border-radius: 8px; text-align: left; 
            border: 1px solid rgba(255, 255, 255, 0.05); 
        }
        .settings-panel label { color: #CBD5E1; }
        .settings-panel input[type="number"] { 
            width: 50px; padding: 6px; margin: 0 8px; 
            background: rgba(15, 23, 42, 0.8); border: 1px solid rgba(0, 240, 255, 0.3); 
            border-radius: 4px; text-align: center; color: #00F0FF; font-weight: bold;
            outline: none; transition: border-color 0.2s;
        }
        .settings-panel input[type="number"]:focus { border-color: #00F0FF; box-shadow: 0 0 8px rgba(0, 240, 255, 0.3); }
        
        /* 漸層科技發光按鈕 */
        .button-group { display: flex; gap: 15px; justify-content: center; margin-top: 25px; flex-wrap: wrap; padding-bottom: 25px;}
        button.action-btn { 
            padding: 12px 24px; border: none; border-radius: 8px; cursor: pointer; 
            font-size: 15px; font-weight: 600; letter-spacing: 1px; color: white;
            transition: all 0.3s ease; text-transform: uppercase;
        }
        .btn-split { 
            background: linear-gradient(135deg, #0052D4, #4364F7); 
            box-shadow: 0 4px 15px rgba(67, 100, 247, 0.3); 
        }
        .btn-split:hover:not(:disabled) { box-shadow: 0 0 20px rgba(67, 100, 247, 0.6); transform: translateY(-2px); }
        
        .btn-merge { 
            background: linear-gradient(135deg, #8E2DE2, #4A00E0); 
            box-shadow: 0 4px 15px rgba(142, 45, 226, 0.3); 
        }
        .btn-merge:hover:not(:disabled) { box-shadow: 0 0 20px rgba(142, 45, 226, 0.6); transform: translateY(-2px); }
        
        button.action-btn:disabled { background: #334155; box-shadow: none; cursor: not-allowed; color: #94A3B8; transform: none; }
        
        .download-btn { 
            display: inline-block; margin-top: 15px; padding: 15px 30px; 
            background: linear-gradient(135deg, #11998E, #38EF7D); color: #000; 
            text-decoration: none; border-radius: 8px; font-weight: 800; font-size: 16px; letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(56, 239, 125, 0.3); transition: all 0.3s;
        }
        .download-btn:hover { box-shadow: 0 0 25px rgba(56, 239, 125, 0.6); transform: translateY(-2px); }
        
        #status { margin-top: 15px; font-size: 15px; color: #00F0FF; text-align: center; text-shadow: 0 0 5px rgba(0, 240, 255, 0.3); }
        #output p { color: #E0E7FF; }
    </style>
</head>
<body>
    <h2>PDF 處理核心 <span>v1.0</span></h2>
    
    <div class="upload-section" id="dropZone">
        <input type="file" id="pdfInput" accept="application/pdf" multiple>
        <label for="pdfInput" class="upload-label">
            <div class="upload-icon">⎘</div>
            <div class="upload-title">點擊載入檔案，或拖曳至此處</div>
            <div class="upload-subtitle">INITIALIZE MULTIPLE FILES SECURELY</div>
        </label>
        
        <div class="file-list-container" id="fileListContainer" style="display: none;">
            <div class="list-header">▶ 已排程檔案序列 (拖曳 ☰ 調整順序)</div>
            <ul id="fileList"></ul>
        </div>
        
        <div class="settings-panel">
            <div class="list-header" style="margin-bottom: 12px;">▶ 參數設定 (分拆模式專用)</div>
            <label>
                擷取範圍：[ 起始 <input type="number" id="startPage" min="1" placeholder="1"> ]  
                → [ 終點 <input type="number" id="endPage" min="1" placeholder="Max"> ]
            </label>
            <div style="font-size: 12px; color: #64748B; margin-top: 8px;">* 參數空白將自動捕捉全檔 / 合併模式將覆寫此設定</div>
        </div>

        <div class="button-group">
            <button id="splitBtn" class="action-btn btn-split">執行批次分拆 (ZIP)</button>
            <button id="mergeBtn" class="action-btn btn-merge">執行序列合併 (PDF)</button>
        </div>
    </div>

    <div id="output" style="text-align: center;"></div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

        const fileInput = document.getElementById('pdfInput');
        const dropZone = document.getElementById('dropZone');
        const fileList = document.getElementById('fileList');
        const fileListContainer = document.getElementById('fileListContainer');
        const outputDiv = document.getElementById('output');
        const splitBtn = document.getElementById('splitBtn');
        const mergeBtn = document.getElementById('mergeBtn');
        const { PDFDocument } = PDFLib;

        let selectedFiles = [];
        let sortableInstance = null;

        function handleNewFiles(files) {
            const newFiles = Array.from(files);
            const pdfFiles = newFiles.filter(file => file.type === 'application/pdf');
            
            if (pdfFiles.length === 0 && newFiles.length > 0) {
                alert('ACCESS DENIED: 僅接受 PDF 格式檔案。');
                return;
            }

            pdfFiles.forEach(file => {
                selectedFiles.push({
                    id: 'doc_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5),
                    file: file
                });
            });
            
            updateFileUI();
        }

        fileInput.addEventListener('change', (e) => {
            handleNewFiles(e.target.files);
            fileInput.value = ''; 
        });

        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, preventDefaults, false);
            document.body.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults (e) {
            e.preventDefault(); e.stopPropagation();
        }

        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, () => dropZone.classList.add('dragover'), false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, () => dropZone.classList.remove('dragover'), false);
        });

        dropZone.addEventListener('drop', (e) => handleNewFiles(e.dataTransfer.files));

        window.removeFile = function(id) {
            selectedFiles = selectedFiles.filter(item => item.id !== id);
            updateFileUI();
        };

        function updateFileUI() {
            if (selectedFiles.length > 0) {
                fileListContainer.style.display = 'block';
                renderFileList();
            } else {
                fileListContainer.style.display = 'none';
            }
        }

        function renderFileList() {
            fileList.innerHTML = '';
            
            selectedFiles.forEach((item) => {
                const li = document.createElement('li');
                li.className = 'sortable-item';
                li.dataset.id = item.id;
                
                li.innerHTML = `
                    <span class="drag-handle" title="拖曳排序">☰</span>
                    <div class="thumbnail-container" id="thumb-container-${item.id}">
                        <span class="loading-text">SYNC...</span>
                    </div>
                    <span class="file-name">${item.file.name}</span>
                    <button class="remove-btn" onclick="removeFile('${item.id}')" title="刪除檔案">✖</button>
                `;
                fileList.appendChild(li);
                generateThumbnail(item);
            });

            if (sortableInstance) sortableInstance.destroy();

            sortableInstance = new Sortable(fileList, {
                animation: 200,
                handle: '.drag-handle',
                ghostClass: 'sortable-ghost',
                onEnd: function (evt) {
                    const movedItem = selectedFiles.splice(evt.oldIndex, 1)[0];
                    selectedFiles.splice(evt.newIndex, 0, movedItem);
                }
            });
        }

        async function generateThumbnail(item) {
            try {
                const arrayBuffer = await item.file.arrayBuffer();
                const loadingTask = pdfjsLib.getDocument({ data: arrayBuffer });
                const pdf = await loadingTask.promise;
                
                const page = await pdf.getPage(1);
                const viewport = page.getViewport({ scale: 1 });
                const scale = 80 / viewport.width;
                const scaledViewport = page.getViewport({ scale: scale });

                const canvas = document.createElement('canvas');
                canvas.className = 'pdf-thumbnail';
                canvas.height = scaledViewport.height;
                canvas.width = scaledViewport.width;

                await page.render({ canvasContext: canvas.getContext('2d'), viewport: scaledViewport }).promise;

                const container = document.getElementById(`thumb-container-${item.id}`);
                if (container) {
                    container.innerHTML = ''; 
                    container.appendChild(canvas);
                }
            } catch (error) {
                const container = document.getElementById(`thumb-container-${item.id}`);
                if (container) container.innerHTML = '<span class="loading-text" style="color:#FF3366">ERROR</span>';
            }
        }

        function prepareProcess() {
            if (selectedFiles.length === 0) {
                alert('REQUIREMENT FAILED: 請至少載入一個檔案。');
                return null;
            }
            splitBtn.disabled = true;
            mergeBtn.disabled = true;
            outputDiv.innerHTML = '<p id="status">▶ 系統處理中，請勿關閉連線...</p>';
            return selectedFiles.map(item => item.file);
        }

        function restoreUI() {
            splitBtn.disabled = false;
            mergeBtn.disabled = false;
        }

        // 分拆模組
        splitBtn.addEventListener('click', async () => {
            const files = prepareProcess();
            if (!files) return;

            const statusText = document.getElementById('status');
            const startInput = document.getElementById('startPage').value;
            const endInput = document.getElementById('endPage').value;

            try {
                const zip = new JSZip();
                let totalProcessedPages = 0;

                for (let f = 0; f < files.length; f++) {
                    const file = files[f];
                    const originalName = file.name.replace('.pdf', '');
                    statusText.innerText = `▶ 分拆進程: 正在解析 [ ${f + 1} / ${files.length} ]...`;
                    
                    const arrayBuffer = await file.arrayBuffer();
                    const pdfDoc = await PDFDocument.load(arrayBuffer);
                    const numberOfPages = pdfDoc.getPageCount();

                    let startPage = parseInt(startInput) || 1;
                    let endPage = parseInt(endInput) || numberOfPages;

                    if (startPage < 1) startPage = 1;
                    if (endPage > numberOfPages) endPage = numberOfPages;
                    if (startPage > endPage) continue;

                    const folder = zip.folder(originalName);

                    for (let i = startPage - 1; i < endPage; i++) {
                        const newPdfDoc = await PDFDocument.create();
                        const [copiedPage] = await newPdfDoc.copyPages(pdfDoc, [i]);
                        newPdfDoc.addPage(copiedPage);

                        const pdfBytes = await newPdfDoc.save();
                        folder.file(`${originalName}_P${i + 1}.pdf`, pdfBytes);
                        totalProcessedPages++;
                    }
                }

                if (totalProcessedPages === 0) throw new Error('參數無效，零檔案產出');

                statusText.innerText = `▶ 壓縮模組啟動: 正在封裝 ZIP 檔案...`;
                const zipContent = await zip.generateAsync({ type: 'blob' });
                const zipUrl = URL.createObjectURL(zipContent);
                
                outputDiv.innerHTML = `
                    <p style="color:#00F0FF; font-weight:bold;">[ ✓ ] 任務完成：處理 ${files.length} 檔 / 共產出 ${totalProcessedPages} 頁</p>
                    <a href="${zipUrl}" download="System_Export_Split.zip" class="download-btn">⬇ 提取壓縮檔 (ZIP)</a>
                `;
            } catch (error) {
                outputDiv.innerHTML = `<p style="color: #FF3366;">[ ✖ ] 嚴重錯誤：${error.message}</p>`;
            } finally { restoreUI(); }
        });

        // 合併模組
        mergeBtn.addEventListener('click', async () => {
            const files = prepareProcess();
            if (!files) return;

            if (files.length < 2) {
                alert('REQUIREMENT FAILED: 合併程序需至少兩個檔案節點。');
                outputDiv.innerHTML = '';
                restoreUI();
                return;
            }

            const statusText = document.getElementById('status');

            try {
                const mergedPdf = await PDFDocument.create();
                let totalMergedPages = 0;

                for (let f = 0; f < files.length; f++) {
                    statusText.innerText = `▶ 合併進程: 正在對齊區塊 [ ${f + 1} / ${files.length} ]...`;
                    
                    const arrayBuffer = await files[f].arrayBuffer();
                    const pdfDoc = await PDFDocument.load(arrayBuffer);
                    
                    const pageIndices = Array.from({ length: pdfDoc.getPageCount() }, (_, i) => i);
                    const copiedPages = await mergedPdf.copyPages(pdfDoc, pageIndices);
                    
                    copiedPages.forEach((page) => {
                        mergedPdf.addPage(page);
                        totalMergedPages++;
                    });
                }

                statusText.innerText = `▶ 封裝模組啟動: 正在輸出最終 PDF...`;

                const mergedPdfFile = await mergedPdf.save();
                const blob = new Blob([mergedPdfFile], { type: 'application/pdf' });
                const url = URL.createObjectURL(blob);
                
                outputDiv.innerHTML = `
                    <p style="color:#00F0FF; font-weight:bold;">[ ✓ ] 任務完成：整合 ${files.length} 檔 / 總計 ${totalMergedPages} 頁</p>
                    <a href="${url}" download="System_Export_Merged.pdf" class="download-btn">⬇ 提取合併檔 (PDF)</a>
                `;
            } catch (error) {
                outputDiv.innerHTML = '<p style="color: #FF3366;">[ ✖ ] 嚴重錯誤：無法解析加密或損毀區塊。</p>';
            } finally { restoreUI(); }
        });
    </script>
</body>
</html>
